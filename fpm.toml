name = "FUNDAL"
version = "2.1.5"
author = "Stefano Zaghi"
maintainer = "stefano.zaghi@gmail.com"
copyright = "Copyright © 2024, Stefano Zaghi"
license = "Multiple licenses"
description = "Fortran UNified Device Acceleration Library: unified API for GPU/device memory over OpenACC and OpenMP"
homepage = "https://github.com/szaghi/FUNDAL"

# Default build: gfortran (or any compiler), compile-time CPU mode (no backend macro), without the MPI handler.
# A device backend is selected with extra flags, e.g. OpenACC with gfortran:
#   fpm build --flag "-DDEV_OAC -DCOMPILER_GNU -fopenacc"
# fpm cannot exclude a file from the library: FUNDAL_NO_MPI leaves fundal_mpih_object empty (use FoBiS, make MPI=1 or
# CMake -DFUNDAL_MPI=ON for the MPI handler).

[library]
source-dir = "src/lib"
include-dir = ["src/lib"]

[install]
library = true

[build]
auto-executables = false
auto-examples = false
auto-tests = false
# modules named by backend-selected `use` statements (DEVMODULE is the fundal.H macro): not FUNDAL sources
external-modules = ["devmodule", "openacc", "omp_lib", "mpi"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
[preprocess.cpp]
suffixes = ["F90"]
macros = ["FUNDAL_NO_MPI"]

